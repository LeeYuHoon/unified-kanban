name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Sync locked development environment
        run: uv sync --frozen --group dev
      - name: Run full test suite
        run: uv run pytest -o addopts='' -q
      - name: Validate shell syntax
        run: |
          bash -n scripts/setup.sh scripts/uninstall.sh scripts/kanban-smoke.sh \
            scripts/update-hermes-if-needed.sh bin/claude-kanban-hook \
            bin/codex-kanban-hook bin/kanban-adapter
      - name: Compile Python sources
        run: uv run python -m compileall -q src scripts integrations tests
      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
