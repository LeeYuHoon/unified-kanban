name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on macOS
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Sync locked development environment
        run: uv sync --frozen --group dev
      - name: Run full test suite
        run: uv run pytest -o addopts='' -q
      - name: Validate shell syntax
        run: |
          set -euo pipefail
          sources="${RUNNER_TEMP:-/tmp}/shell-sources.tsv"
          python3 scripts/list-shell-sources.py > "$sources"
          checked=0
          while IFS=$'\t' read -r checker path; do
            [ -n "${path:-}" ] || continue
            echo "$checker -n $path"
            "$checker" -n "$path"
            checked=$((checked + 1))
          done < "$sources"
          [ "$checked" -gt 0 ] || { echo "no shell sources were checked" >&2; exit 1; }
          echo "checked $checked shell sources"
      - name: Compile Python sources
        run: uv run python -m compileall -q src scripts integrations tests
      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

  # 실제 release 생성에는 검토한 pin이 들어 있는 로컬 Hermes object database가 필요합니다.
  # upstream `main`에서 pin이 사라지는 일은 현재 변경과 무관하게 생길 수 있으므로,
  # 모든 pull request에서 실행하지 않고 필요할 때만 직접 실행합니다.
  # docs/maintenance.md의 로컬 release 후보 검사는 같은 테스트를 실행하며,
  # 최종 판정에는 그 결과를 사용합니다.
  release-integration:
    name: Real release production on macOS
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Sync locked development environment
        run: uv sync --frozen --group dev
      - name: Mirror the official Hermes object database
        run: |
          set -euo pipefail
          git clone --bare --no-tags --single-branch --branch main \
            https://github.com/NousResearch/hermes-agent.git \
            "${RUNNER_TEMP}/hermes-source.git"
          git -C "${RUNNER_TEMP}/hermes-source.git" cat-file -e \
            "$(cat patches/hermes-agent-supported-upstream)^{commit}"
      - name: Produce and verify a real release
        env:
          UNIFIED_KANBAN_TEST_HERMES_SOURCE: ${{ runner.temp }}/hermes-source.git
          UNIFIED_KANBAN_TEST_HERMES_REQUIRED: "1"
        run: uv run pytest -o addopts='' -q tests/test_hermes_release_integration.py
